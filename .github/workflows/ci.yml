name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service: 'services/auth-service/**'
            catalog-service: 'services/catalog-service/**'
            seats-service: 'services/seats-service/**'
            bookings-service: 'services/bookings-service/**'
            payments-service: 'services/payments-service/**'
            otp-service: 'services/otp-service/**'
            frontend: 'frontend/**'
            gateway: 'gateway/**'

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.service }}
        run: |
          case "${{ matrix.service }}" in
            frontend) docker build -t test-frontend ./frontend ;;
            gateway) docker build -t test-gateway ./gateway ;;
            *) docker build -t test-${{ matrix.service }} ./services/${{ matrix.service }} ;;
          esac
