name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        shell: bash
        run: |
          set -Eeuo pipefail

          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker info >/dev/null 2>&1; then
            echo "Runner requires passwordless sudo for Docker; using sudo."
            DOCKER=(sudo docker)
          else
            echo "The self-hosted runner cannot access Docker."
            echo "Runner identity: $(id)"
            ls -l /var/run/docker.sock || true
            echo "Add the runner user to the docker group, then restart the runner service."
            exit 1
          fi

          "${DOCKER[@]}" compose version
          "${DOCKER[@]}" compose config --quiet
          "${DOCKER[@]}" compose up -d --build --remove-orphans
          "${DOCKER[@]}" compose ps
